"left:30%\">3<\/span><span class=\"coord-tick coord-x\" style=\"left:50%\">5<\/span><span class=\"coord-tick coord-x\" style=\"left:70%\">7<\/span><span class=\"coord-tick coord-x\" style=\"left:90%\">9<\/span>\n              <span class=\"coord-tick coord-y\" style=\"bottom:10%\">1<\/span><span class=\"coord-tick coord-y\" style=\"bottom:30%\">3<\/span><span class=\"coord-tick coord-y\" style=\"bottom:50%\">5<\/span><span class=\"coord-tick coord-y\" style=\"bottom:70%\">7<\/span><span class=\"coord-tick coord-y\" style=\"bottom:90%\">9<\/span>\n            <\/div>\n            <div class=\"north-arrow\" aria-hidden=\"true\"><span>N<\/span><\/div>\n            <div id=\"beamDiagonalA\" class=\"beam map-beam beam-diagonal-a\" aria-hidden=\"true\"><\/div>\n            <div id=\"beamDiagonalB\" class=\"beam map-beam beam-diagonal-b\" aria-hidden=\"true\"><\/div>\n            <div id=\"centerOrb\" class=\"center-orb\" aria-hidden=\"true\"><span class=\"orb-text\">?<\/span><\/div>\n\n            <button class=\"gate gate-jung\" data-gate=\"jung\" type=\"button\" aria-label=\"중화가, 좌표 3,6\"><span class=\"gate-label\">중화가 <b>(3,6)<\/b><\/span><\/button>\n            <button class=\"gate gate-inhwa\" data-gate=\"inhwa\" type=\"button\" aria-label=\"인화문, 좌표 5,1\"><span class=\"gate-label\">인화문 <b>(5,1)<\/b><\/span><\/button>\n            <button class=\"gate gate-seon\" data-gate=\"seon\" type=\"button\" aria-label=\"선린문, 좌표 9,6\"><span class=\"gate-label\">선린문 <b>(9,6)<\/b><\/span><\/button>\n            <button class=\"gate gate-hanjung\" data-gate=\"hanjung\" type=\"button\" aria-label=\"한중문, 좌표 5,9\"><span class=\"gate-label\">한중문 <b>(5,9)<\/b><\/span><\/button>\n\n            <span class=\"landmark-label label-port\">인천 내항<\/span>\n            <span class=\"landmark-label label-station\">인천역<\/span>\n            <span class=\"landmark-label label-town\">차이나타운<\/span>\n            <span class=\"landmark-label label-songwol\">송월동 동화마을<\/span>\n            <span class=\"landmark-label label-park\">자유공원<\/span>\n            <span class=\"landmark-label label-treaty\">한미수교 100주년기념탑<\/span>\n            <span class=\"landmark-label label-macarthur\">맥아더장군동상<\/span>\n            <span class=\"landmark-label label-museum\">짜장면박물관<\/span>\n            <span class=\"landmark-label label-shrine\">의선당<\/span>\n            <span class=\"landmark-label label-mural\">삼국지·초한지 벽화거리<\/span>\n            <span class=\"landmark-label label-center\">한중문화관<\/span>\n            <span class=\"landmark-label label-openport\">인천 개항박물관<\/span>\n            <span class=\"landmark-label label-christian\">한국기독교 100주년기념탑<\/span>\n          <\/div>\n          <div class=\"map-note\">실제 관광안내도 방향 반영 · 패루는 가장 가까운 게임 좌표에 표시했습니다<\/div>\n        <\/div>\n      <\/section>\n\n      <aside class=\"side-panel\">\n        <p class=\"kicker\">FINAL MATH MISSION<\/p>\n        <h1>네 개의 패루와<br>빛의 교점<\/h1>\n        <p class=\"lead\">실제 관광지 방향에 가깝게 놓인 네 개의 패루를 연결하고, 두 빛의 길이 만나는 좌표를 찾으세요.<\/p>\n        <div class=\"mission\"><small>MISSION<\/small><b>서로 마주 보는 패루를 연결해<br>수학의 빛이 숨은 교점을 찾아라!<\/b><\/div>\n\n        <div class=\"step-card\" id=\"stepOneCard\">\n          <h2>1. 마주 보는 패루 연결하기<\/h2>\n          <p>지도에서 패루 두 개를 차례로 누르세요. 같은 y좌표의 두 문과 같은 x좌표의 두 문이 각각 연결됩니다.<\/p>\n          <div class=\"pair-progress\"><div class=\"pair-slot\" id=\"diagonalASlot\">중화가 ↔ 선린문<\/div><div class=\"pair-slot\" id=\"diagonalBSlot\">한중문 ↔ 인화문<\/div><\/div>\n        <\/div>\n\n        <div class=\"step-card hidden\" id=\"stepTwoCard\">\n          <h2>2. 빛이 만나는 교점 찾기<\/h2>\n          <p>좌표평면을 이용해 두 빛의 길이 만나는 교점의 좌표를 선택하세요.<\/p>\n          <div class=\"choices\" id=\"choices\">\n            <button class=\"choice\" type=\"button\" data-answer=\"4,6\">(4, 6)<\/button>\n            <button class=\"choice\" type=\"button\" data-answer=\"5,6\">(5, 6)<\/button>\n            <button class=\"choice\" type=\"button\" data-answer=\"5,5\">(5, 5)<\/button>\n            <button class=\"choice\" type=\"button\" data-answer=\"6,6\">(6, 6)<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"status\" id=\"status\" aria-live=\"polite\">첫 번째 패루를 선택하세요.<\/div>\n\n        <div class=\"result\" id=\"result\" aria-live=\"polite\">\n          <span class=\"light\">✨<\/span><small>MATH LIGHT FOUND<\/small><h2>정답은 (5, 6)입니다!<\/h2><p>두 빛의 길이 만나는 교점에서<br>차이나타운의 수학의 빛을 찾았습니다.<\/p>\n        <\/div>\n\n        <div class=\"controls\"><button class=\"secondary\" id=\"hintButton\" type=\"button\">힌트 보기<\/button><button class=\"primary hidden\" id=\"playAgain\" type=\"button\">다시 풀기<\/button><button class=\"primary hidden\" id=\"continueTour\" type=\"button\">수학의 빛 모으기 →<\/button><\/div>\n      <\/aside>\n    <\/main>\n  <\/div>\n  <div class=\"toast\" id=\"toast\" aria-live=\"polite\"><\/div>\n\n  <script>\n    const gates={\n      jung:{name:'중화가',opposite:'seon',pair:'diagonalA'},\n      seon:{name:'선린문',opposite:'jung',pair:'diagonalA'},\n      inhwa:{name:'인화문',opposite:'hanjung',pair:'diagonalB'},\n      hanjung:{name:'한중문',opposite:'inhwa',pair:'diagonalB'}\n    };\n    let selectedGate=null;\n    let solvedPairs=new Set();\n    let hintLevel=0;\n    let soundOn=true;\n    let audioContext;\n    const status=document.querySelector('#status');\n    const toast=document.querySelector('#toast');\n\n    function beep(freq=520,duration=.1,type='sine'){\n      if(!soundOn)return;\n      try{audioContext ||= new (window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.075,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+duration)}catch(e){}\n    }\n    function successSound(){beep(523,.1);setTimeout(()=>beep(659,.12),110);setTimeout(()=>beep(784,.2),230)}\n    function showToast(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}\n    function setStatus(message,type=''){status.textContent=message;status.className='status'+(type?' '+type:'')}\n    function gateElement(id){return document.querySelector(`.map-overlay [data-gate=\"${id}\"]`)}\n\n    function chooseGate(id){\n      if(solvedPairs.has(gates[id].pair)){showToast('이 방향의 빛은 이미 연결됐습니다.');return}\n      if(!selectedGate){selectedGate=id;gateElement(id).classList.add('selected');setStatus(`${gates[id].name}을(를) 선택했습니다. 마주 보는 패루를 선택하세요.`);beep(430,.08);return}\n      if(selectedGate===id){gateElement(id).classList.remove('selected');selectedGate=null;setStatus('선택을 취소했습니다. 첫 번째 패루를 다시 선택하세요.');return}\n      const first=selectedGate;gateElement(first).classList.remove('selected');selectedGate=null;\n      if(gates[first].opposite!==id){\n        gateElement(first).classList.add('wrong');gateElement(id).classList.add('wrong');setTimeout(()=>{gateElement(first).classList.remove('wrong');gateElement(id).classList.remove('wrong')},450);setStatus(`${gates[first].name}과(와) ${gates[id].name}은 서로 마주 보지 않습니다.`,'error');beep(170,.15,'sawtooth');return\n      }\n      solvePair(gates[first].pair,first,id);\n    }\n    function solvePair(pair,first,second){\n      solvedPairs.add(pair);gateElement(first).classList.add('solved');gateElement(second).classList.add('solved');document.querySelector(pair==='diagonalA'?'#beamDiagonalA':'#beamDiagonalB').classList.add('show');const slot=document.querySelector(pair==='diagonalA'?'#diagonalASlot':'#diagonalBSlot');slot.classList.add('filled');slot.textContent=`${gates[first].name} ↔ ${gates[second].name}`;setStatus('대각선 빛의 길을 정확하게 연결했습니다!','success');successSound();\n      if(solvedPairs.size===2)setTimeout(showCoordinateQuestion,900);else setTimeout(()=>setStatus('남은 두 패루도 서로 연결하세요.'),700)\n    }\n    function showCoordinateQuestion(){\n      document.querySelector('#stepOneCard').classList.add('hidden');document.querySelector('#stepTwoCard').classList.remove('hidden');document.querySelector('#centerOrb').classList.add('ready');document.querySelector('#progressOne').classList.remove('active');document.querySelector('#progressOne').classList.add('done');document.querySelector('#progressLine').classList.add('done');document.querySelector('#progressTwo').classList.add('active');setStatus('두 빛의 길이 만나는 교점 좌표를 선택하세요.');\n    }\n    function chooseCoordinate(button){\n      if(button.dataset.answer!=='5,6'){button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');setStatus(`${button.textContent}은 두 빛의 길이 만나는 교점이 아닙니다.`,'error');beep(170,.16,'sawtooth');return}\n      document.querySelectorAll('.choice').forEach(choice=>choice.disabled=true);button.classList.add('correct');document.querySelector('#centerOrb').classList.remove('ready');document.querySelector('#centerOrb').classList.add('found');document.querySelector('#centerOrb .orb-text').textContent='光';document.querySelector('#progressTwo').classList.remove('active');document.querySelector('#progressTwo').classList.add('done');document.querySelector('#stepTwoCard').classList.add('hidden');status.classList.add('hidden');document.querySelector('#result').classList.add('show');document.querySelector('#playAgain').classList.remove('hidden');document.querySelector('#continueTour').classList.remove('hidden');document.querySelector('#hintButton').classList.add('hidden');successSound();makeSparks();\n    }\n    function makeSparks(){\n      const shell=document.querySelector('.shell');for(let i=0;i<24;i++){const spark=document.createElement('i');spark.className='spark';spark.style.left=(45+Math.random()*10)+'%';spark.style.top=(43+Math.random()*14)+'%';spark.style.setProperty('--dx',(Math.random()*500-250)+'px');spark.style.setProperty('--dy',(Math.random()*500-250)+'px');shell.appendChild(spark);requestAnimationFrame(()=>spark.classList.add('go'));setTimeout(()=>spark.remove(),1200)}\n    }\n    function showHint(){\n      hintLevel++;\n      if(solvedPairs.size<2){const remaining=!solvedPairs.has('diagonalA')?'중화가 (3,6)와 선린문 (9,6)은 y좌표가 같습니다.':'한중문 (5,9)과 인화문 (5,1)은 x좌표가 같습니다.';setStatus(`힌트: ${remaining}`);return}\n      setStatus(hintLevel<2?'힌트: 세로선은 x=5, 가로선은 y=6입니다.':'힌트: x=5와 y=6이 만나는 좌표를 찾으세요.');\n    }\n    function resetGame(){\n      selectedGate=null;solvedPairs=new Set();hintLevel=0;document.querySelectorAll('.map-overlay .gate').forEach(gate=>gate.classList.remove('selected','solved','wrong'));document.querySelectorAll('.beam').forEach(beam=>beam.classList.remove('show'));document.querySelector('#centerOrb').classList.remove('ready','found');document.querySelector('#centerOrb .orb-text').textContent='?';document.querySelectorAll('.pair-slot').forEach((slot,index)=>{slot.classList.remove('filled');slot.textContent=index===0?'중화가 ↔ 선린문':'한중문 ↔ 인화문'});document.querySelector('#stepOneCard').classList.remove('hidden');document.querySelector('#stepTwoCard').classList.add('hidden');document.querySelectorAll('.choice').forEach(choice=>{choice.disabled=false;choice.classList.remove('wrong','correct')});document.querySelector('#result').classList.remove('show');status.classList.remove('hidden');document.querySelector('#playAgain').classList.add('hidden');document.querySelector('#continueTour').classList.add('hidden');document.querySelector('#hintButton').classList.remove('hidden');document.querySelector('#progressOne').className='progress-step active';document.querySelector('#progressTwo').className='progress-step';document.querySelector('#progressLine').className='progress-line';setStatus('첫 번째 패루를 선택하세요.');\n    }\n\n    document.querySelectorAll('.map-overlay .gate').forEach(gate=>{gate.addEventListener('click',()=>chooseGate(gate.dataset.gate));gate.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();chooseGate(gate.dataset.gate)}})});\n    document.querySelectorAll('.choice').forEach(button=>button.addEventListener('click',()=>chooseCoordinate(button)));\n    document.querySelector('#hintButton').addEventListener('click',showHint);\n    document.querySelector('#playAgain').addEventListener('click',resetGame);\n    document.querySelector('#continueTour').addEventListener('click',()=>{parent.Chinatown.go(15)});\n    document.querySelector('#resetTop').addEventListener('click',resetGame);\n    document.querySelector('#soundButton').addEventListener('click',event=>{soundOn=!soundOn;event.currentTarget.textContent=soundOn?'🔊 소리':'🔇 소리';if(soundOn)beep(600,.08)});\n    window.addEventListener('error',event=>{window.__runtimeErrors ||= [];window.__runtimeErrors.push(String(event.message||event.error))});\n  <\/script>\n<\/body>\n<\/html>\n"},{"number":15,"title":"C01 · 장면 15 | 차이나타운의 수학","html":"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n  <meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\"><meta name=\"description\" content=\"차이나타운에서 발견한 세 가지 수학 원리 회상\"><title>C01 · 장면 15 | 차이나타운의 수학<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin><link href=\"https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@700&family=Noto+Sans+KR:wght@400;700;900&display=swap\" rel=\"stylesheet\"><style data-source=\"mathtour-common.css · inlined\">\r\n:root {\n  color-scheme: dark;\n  --mt-red: #8c3030;\n  --mt-red-dark: #5f1b20;\n  --mt-gold: #d4af37;\n  --mt-gold-light: #ffec91;\n  --mt-ink: #08121f;\n  --mt-paper: #f5f0e6;\n  --mt-text-dark: #2d3748;\n}\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  width: 100%;\n  min-height: 100%;\n  margin: 0;\n}\n\nbody {\n  display: grid;\n  place-items: center;\n  overflow: hidden;\n  padding: 16px;\n  color: white;\n  background: radial-gradient(circle at 50% 15%, #27384d, #07111f 58%, #02060c);\n  font-family: \"Noto Sans KR\", \"Malgun Gothic\", sans-serif;\n}\n\nbutton { font: inherit; }\n\n.game-container {\n  position: relative;\n  isolation: isolate;\n  width: min(1066px, calc(100vw - 32px));\n  aspect-ratio: 16 / 9;\n  overflow: hidden;\n  border: 2px solid var(--mt-gold);\n  border-radius: 12px;\n  background: var(--mt-ink);\n  box-shadow: 0 26px 80px rgba(0, 0, 0, 0.58), 0 0 36px rgba(212, 175, 55, 0.11);\n}\n\n.scene-bg {\n  position: absolute;\n  inset: 0;\n  z-index: 0;\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\n\n.scene-bg.dim { filter: brightness(0.48) saturate(0.72); }\n.scene-bg.deep-dim { filter: brightness(0.29) saturate(0.58); }\n.scene-bg.soft { inset: -2%; width: 104%; height: 104%; filter: blur(4px) brightness(0.35) saturate(0.65); }\n\n.scene-grade {\n  position: absolute;\n  inset: 0;\n  z-index: 1;\n  pointer-events: none;\n  background:\n    linear-gradient(180deg, rgba(2, 7, 15, 0.14), transparent 40%, rgba(2, 7, 15, 0.64)),\n    radial-gradient(circle at 50% 50%, transparent 18%, rgba(0, 4, 11, 0.56) 100%);\n}\n\n.topbar {\n  position: absolute;\n  z-index: 20;\n  top: 16px;\n  right: 18px;\n  left: 18px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  pointer-events: none;\n}\n\n.brand {\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  padding: 8px 13px;\n  border: 1px solid rgba(212, 175, 55, 0.76);\n  border-radius: 6px;\n  background: rgba(4, 13, 26, 0.82);\n  backdrop-filter: blur(7px);\n}\n\n.brand b { font-family: \"Nanum Myeongjo\", serif; font-size: 13px; letter-spacing: 0.05em; }\n.brand i { color: var(--mt-gold-light); font-style: normal; }\n\n.chapter {\n  padding: 8px 12px;\n  border: 1px solid rgba(255, 255, 255, 0.2);\n  border-radius: 999px;\n  color: #efe3c0;\n  background: rgba(4, 13, 26, 0.76);\n  font-family: \"Nanum Gothic Coding\", monospace;\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: 0.06em;\n}\n\n.paper-panel {\n  border: 1px solid rgba(212, 175, 55, 0.78);\n  border-radius: 8px;\n  color: #2d3748;\n  backgro
