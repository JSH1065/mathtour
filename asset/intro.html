<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MATH INCHEON – 사라진 인천의 빛 게임 오프닝" />
    <title>MATH INCHEON – 사라진 인천의 빛</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
        --gold: #ffd34e;
        --navy: #04132f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #00040e;
      }

      button {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      .stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #00040e;
      }

      .stage[hidden] {
        display: none;
      }

      #openingVideo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #00040e;
      }

      .cinema-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 10vw 2vw rgba(0, 0, 0, 0.58);
      }

      .top-controls {
        position: absolute;
        z-index: 3;
        top: max(18px, env(safe-area-inset-top));
        right: max(18px, env(safe-area-inset-right));
        display: flex;
        gap: 10px;
      }

      .control-button {
        min-width: 92px;
        padding: 11px 17px;
        border: 1px solid rgba(255, 255, 255, 0.34);
        border-radius: 999px;
        color: white;
        background: rgba(1, 9, 27, 0.68);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(12px);
        cursor: pointer;
        font-size: 0.86rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      .control-button:hover,
      .control-button:focus-visible {
        outline: none;
        transform: translateY(-2px);
        border-color: var(--gold);
        background: rgba(8, 27, 65, 0.88);
      }

      .progress-track {
        position: absolute;
        z-index: 3;
        right: 0;
        bottom: 0;
        left: 0;
        height: 5px;
        background: rgba(255, 255, 255, 0.16);
      }

      #progressFill {
        display: block;
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #f4ac27, #fff087);
        box-shadow: 0 0 18px rgba(255, 211, 78, 0.8);
        transition: width 100ms linear;
      }

      #posterStage {
        isolation: isolate;
        background: var(--navy);
      }

      #posterImage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        animation: posterReveal 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .poster-shade {
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(180deg, transparent 54%, rgba(0, 7, 24, 0.54) 78%, rgba(0, 6, 20, 0.84) 100%),
          radial-gradient(circle at 50% 45%, transparent 25%, rgba(0, 6, 22, 0.14) 72%);
        pointer-events: none;
      }

      .start-panel {
        position: absolute;
        z-index: 2;
        bottom: max(5.5vh, 34px);
        left: 50%;
        display: grid;
        justify-items: center;
        gap: 12px;
        width: min(92vw, 680px);
        transform: translateX(-50%);
        animation: panelRise 800ms 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .start-kicker {
        margin: 0;
        color: rgba(255, 255, 255, 0.88);
        font-size: clamp(0.72rem, 1.4vw, 0.92rem);
        font-weight: 900;
        letter-spacing: 0.3em;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.86);
      }

      #gameStartButton {
        position: relative;
        min-width: min(78vw, 330px);
        padding: 18px 42px 17px;
        overflow: hidden;
        border: 2px solid #fff2a8;
        border-radius: 999px;
        color: #061635;
        background: linear-gradient(180deg, #fff085 0%, #ffd13f 56%, #f3a91d 100%);
        box-shadow:
          0 0 0 5px rgba(255, 207, 55, 0.14),
          0 14px 38px rgba(0, 0, 0, 0.46),
          0 0 42px rgba(255, 197, 37, 0.48);
        cursor: pointer;
        font-size: clamp(1.25rem, 3vw, 1.9rem);
        font-weight: 1000;
        letter-spacing: 0.11em;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.48);
        transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
      }

      #gameStartButton::after {
        position: absolute;
        top: -40%;
        bottom: -40%;
        left: -28%;
        width: 22%;
        content: "";
        background: rgba(255, 255, 255, 0.72);
        filter: blur(8px);
        transform: skewX(-22deg);
        animation: buttonShine 2.5s 1.2s ease-in-out infinite;
      }

      #gameStartButton:hover,
      #gameStartButton:focus-visible {
        outline: none;
        transform: translateY(-4px) scale(1.025);
        filter: saturate(1.08) brightness(1.05);
        box-shadow:
          0 0 0 7px rgba(255, 207, 55, 0.18),
          0 18px 44px rgba(0, 0, 0, 0.5),
          0 0 52px rgba(255, 197, 37, 0.66);
      }

      #gameStartButton:active {
        transform: translateY(1px) scale(0.985);
      }

      .start-help {
        margin: 0;
        color: rgba(255, 255, 255, 0.76);
        font-size: 0.78rem;
        font-weight: 700;
        text-shadow: 0 2px 9px rgba(0, 0, 0, 0.9);
      }

      .fade-out {
        animation: fadeOut 420ms ease forwards;
        pointer-events: none;
      }

      @keyframes posterReveal {
        from { opacity: 0; transform: scale(1.055); filter: brightness(1.45); }
        to { opacity: 1; transform: scale(1); filter: brightness(1); }
      }

      @keyframes panelRise {
        from { opacity: 0; transform: translate(-50%, 30px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }

      @keyframes buttonShine {
        0%, 35% { left: -28%; opacity: 0; }
        48% { opacity: 0.8; }
        65%, 100% { left: 116%; opacity: 0; }
      }

      @keyframes fadeOut {
        to { opacity: 0; transform: scale(1.025); }
      }

      @media (max-aspect-ratio: 4 / 3) {
        #posterImage {
          object-fit: contain;
          background: #04132f;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <section id="videoStage" class="stage" aria-label="게임 오프닝 영상">
      <video id="openingVideo" autoplay playsinline preload="auto">
        <source src="./opening.mp4" type="video/mp4" />
      </video>
      <div class="cinema-vignette" aria-hidden="true"></div>
      <div class="top-controls">
        <button id="soundButton" class="control-button" type="button" aria-pressed="true">SOUND ON</button>
        <button id="skipButton" class="control-button" type="button">SKIP 〉</button>
      </div>
      <div class="progress-track" aria-hidden="true"><span id="progressFill"></span></div>
    </section>

    <section id="posterStage" class="stage" hidden aria-label="게임 시작 화면">
      <img id="posterImage" src="./opening-poster.webp" alt="MATH INCHEON – 사라진 인천의 빛" />
      <div class="poster-shade" aria-hidden="true"></div>
      <div class="start-panel">
        <p class="start-kicker">MATH TOUR ADVENTURE</p>
        <button id="gameStartButton" type="button">GAME START</button>
        <p class="start-help">버튼을 누르면 인천 수학 탐험이 시작됩니다</p>
      </div>
    </section>

    <script>
      (() => {
        "use strict";

        const videoStage = document.querySelector("#videoStage");
        const posterStage = document.querySelector("#posterStage");
        const openingVideo = document.querySelector("#openingVideo");
        const skipButton = document.querySelector("#skipButton");
        const soundButton = document.querySelector("#soundButton");
        const gameStartButton = document.querySelector("#gameStartButton");
        const progressFill = document.querySelector("#progressFill");
        let posterVisible = false;

        function updateSoundButton() {
          const audible = !openingVideo.muted && openingVideo.volume > 0;
          soundButton.textContent = audible ? "SOUND ON" : "SOUND OFF";
          soundButton.setAttribute("aria-pressed", String(audible));
        }

        function showPoster() {
          if (posterVisible) return;
          posterVisible = true;
          openingVideo.pause();
          videoStage.classList.add("fade-out");
          window.setTimeout(() => {
            videoStage.hidden = true;
            posterStage.hidden = false;
            gameStartButton.focus({ preventScroll: true });
          }, 380);
        }

        async function startOpening() {
          openingVideo.muted = false;
          updateSoundButton();
          try {
            await openingVideo.play();
          } catch {
            openingVideo.muted = true;
            updateSoundButton();
            try {
              await openingVideo.play();
            } catch {
              showPoster();
            }
          }
        }

        openingVideo.addEventListener("timeupdate", () => {
          const ratio = openingVideo.duration ? openingVideo.currentTime / openingVideo.duration : 0;
          progressFill.style.width = `${Math.min(100, ratio * 100)}%`;
        });
        openingVideo.addEventListener("ended", showPoster);
        openingVideo.addEventListener("error", showPoster);
        skipButton.addEventListener("click", showPoster);

        soundButton.addEventListener("click", async () => {
          openingVideo.muted = !openingVideo.muted;
          updateSoundButton();
          if (openingVideo.paused && !posterVisible) {
            try { await openingVideo.play(); } catch { /* keep the visual fallback */ }
          }
        });

        gameStartButton.addEventListener("click", () => {
          posterStage.classList.add("fade-out");
          window.setTimeout(() => {
            window.location.href = "../index.html";
          }, 320);
        });

        document.addEventListener("keydown", (event) => {
          if (!posterVisible && (event.key === "Escape" || event.key.toLowerCase() === "s")) {
            showPoster();
          } else if (posterVisible && event.key === "Enter") {
            gameStartButton.click();
          }
        });

        updateSoundButton();
        startOpening();
      })();
    </script>
  </body>
</html>
